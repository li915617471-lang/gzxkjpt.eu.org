<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="信息分享平台板块内容">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta name="theme-color" content="#090d10">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <title>板块内容 | 信息分享平台</title>
  <link rel="stylesheet" href="styles.css?v=16">
  <link rel="stylesheet" href="category.css?v=4">
  <script src="cloud-config.js" defer></script>
  <script src="assets/vendor/supabase-2.111.0.min.js" defer></script>
  <script src="cloud.js" defer></script>
  <script src="content-service.js?v=12" defer></script>
  <script src="assets/vendor/lucide-0.468.0.min.js" defer></script>
  <script src="pwa.js?v=2" defer></script>
  <script src="category.js?v=8" defer></script>
</head>
<body class="category-page">
  <div class="scanline" aria-hidden="true"></div>
  <header class="topbar category-topbar">
    <a class="brand" href="index.html" aria-label="返回信息分享平台首页">
      <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
      <span class="brand-copy"><strong>信息分享平台</strong><small>全球前沿知识索引</small></span>
    </a>
    <nav id="categoryNav" class="primary-nav" aria-label="内容板块"></nav>
    <div class="top-actions"><a class="admin-entry" href="admin.html" title="进入平台后台">后台</a></div>
  </header>

  <main>
    <section id="categoryHero" class="category-hero" aria-labelledby="categoryTitle">
      <div class="category-hero-inner">
        <a class="category-back" href="index.html"><i data-lucide="arrow-left"></i><span>返回总览</span></a>
        <span id="categoryEyebrow" class="category-eyebrow">板块观察</span>
        <h1 id="categoryTitle">正在加载板块</h1>
        <p id="categoryDescription"></p>
        <div id="categoryTopics" class="category-topics" aria-label="板块关注方向"></div>
        <div id="categoryMetrics" class="category-metrics" aria-label="板块内容统计"></div>
      </div>
    </section>

    <section class="category-feed" aria-labelledby="categoryFeedTitle">
      <div class="category-feed-head">
        <div><span class="section-label">精选资料</span><h2 id="categoryFeedTitle">最新内容</h2></div>
        <span id="categoryCount" class="result-count">正在同步内容</span>
      </div>
      <div class="category-tools">
        <div class="category-search-modes" role="group" aria-label="搜索范围">
          <button class="is-active" type="button" data-search-mode="local" aria-pressed="true">本站</button>
          <button type="button" data-search-mode="authority" aria-pressed="false">权威资料</button>
        </div>
        <form id="categorySearchForm" class="category-search-form" role="search">
          <label class="category-search" aria-label="板块搜索">
            <i data-lucide="search" aria-hidden="true"></i>
            <input id="categorySearch" type="search" placeholder="搜索本板块内容" autocomplete="off">
          </label>
          <button id="categorySearchSubmit" class="category-search-submit" type="submit" hidden>
            <i data-lucide="search"></i><span>搜索</span>
          </button>
        </form>
        <label id="categorySortLabel" class="category-sort-label">
          <span>排序</span>
          <select id="categorySort" aria-label="板块内容排序">
            <option value="latest">最新发布</option>
            <option value="hot">热度优先</option>
            <option value="depth">深度优先</option>
          </select>
        </label>
      </div>
      <div id="externalSearchInfo" class="external-search-info" hidden>
        <i data-lucide="library"></i>
        <span>搜索词会发送给开放学术索引；外文标题与摘要会发送给公开翻译服务，不发送账号或联系方式。</span>
      </div>
      <div id="categoryStories" class="story-grid"></div>
      <div id="categoryEmpty" class="empty-state" hidden>
        <i data-lucide="rss"></i><strong>正在同步内容</strong><span>内容将在连接完成后自动显示</span>
      </div>
    </section>
  </main>

  <div id="categoryToast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
