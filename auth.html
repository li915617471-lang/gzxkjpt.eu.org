<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="信息分享平台管理员密码设置">
  <title>信息分享平台 | 设置管理员密码</title>
  <link rel="stylesheet" href="admin.css">
  <script src="cloud-config.js" defer></script>
  <script src="assets/vendor/supabase-2.111.0.min.js" defer></script>
  <script src="auth.js" defer></script>
</head>
<body>
  <main class="auth-gate">
    <form id="passwordForm" class="login-panel">
      <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
      <p>SECURE ADMIN</p>
      <h1>设置管理员密码</h1>
      <span class="login-note">请设置至少 8 位的新密码，完成后会自动进入中文管理后台。</span>
      <label>新密码<input id="password" type="password" required minlength="8" autocomplete="new-password" placeholder="至少 8 位"></label>
      <label>确认新密码<input id="passwordConfirm" type="password" required minlength="8" autocomplete="new-password" placeholder="再次输入新密码"></label>
      <button id="submitPassword" class="primary-button" type="submit">保存密码并进入后台</button>
      <button id="backToAdmin" class="ghost-button" type="button">返回管理员登录</button>
      <span id="authMessage" class="login-message" role="status">正在验证邀请链接...</span>
    </form>
  </main>
</body>
</html>
