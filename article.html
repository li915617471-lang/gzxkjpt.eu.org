<body class="article-page">
  <div class="scanline" aria-hidden="true"></div>
  <div class="reading-progress" aria-hidden="true"><span id="readingProgress"></span></div>
  <header class="article-topbar">
    <a class="brand" href="index.html" aria-label="返回信息分享平台首页">
      <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
      <span class="brand-copy"><strong>信息分享平台</strong><small>TECH &amp; INDUSTRY INDEX</small></span>
    </a>
    <nav class="article-actions" aria-label="文章工具">
      <a class="article-icon-link" href="index.html" title="返回首页"><i data-lucide="arrow-left"></i><span>返回首页</span></a>
      <button id="copyLink" class="article-icon-button" type="button" title="复制文章链接"><i data-lucide="link"></i></button>
      <button id="articleBookmark" class="article-icon-button" type="button" title="收藏文章"><i data-lucide="bookmark"></i></button>
      <a class="article-icon-link admin-shortcut" href="admin.html" title="进入后台"><i data-lucide="settings"></i><span>后台</span></a>
    </nav>
  </header>

  <main>
    <div id="articleLoading" class="article-state">正在加载内容...</div>
    <div id="articleMissing" class="article-state" hidden>
      <strong>没有找到这篇内容</strong>
      <a href="index.html">返回内容首页</a>
    </div>

    <article id="articleContent" hidden>
      <header class="article-hero">
        <div class="article-breadcrumb"><a href="index.html">首页</a><span>/</span><a id="categoryLink" href="index.html"></a></div>
        <div class="article-meta">
          <span id="articleCategory" class="category-tag"></span>
          <time id="articleDate"></time>
          <span id="articleRead"></span>
        </div>
        <h1 id="articleTitle"></h1>
        <p id="articleExcerpt" class="article-lead"></p>
        <figure class="article-cover"><img id="articleImage" alt=""></figure>
      </header>

      <div class="article-layout">
        <div class="article-body">
          <div id="articleBody"></div>
          <div id="articleTags" class="article-tags"></div>
        </div>

        <aside class="article-rail" aria-label="文章信息">
          <section class="source-brief">
            <div class="source-brief-title"><i data-lucide="file-search"></i><span>简要来源</span></div>
            <strong id="articleSource"></strong>
            <p id="sourceBriefNote"></p>
            <a id="sourceLink" target="_blank" rel="noopener noreferrer">查看完整原文 <i data-lucide="external-link"></i></a>
            <dl class="source-brief-facts">
              <div><dt>原文发布</dt><dd id="sourcePublishedAt"></dd></div>
              <div><dt>平台整理</dt><dd id="sourceCollectedAt"></dd></div>
            </dl>
          </section>
          <section>
            <span>内容坐标</span>
            <dl>
              <div><dt>板块</dt><dd id="railCategory"></dd></div>
              <div><dt>发布时间</dt><dd id="railDate"></dd></div>
              <div><dt>内容热度</dt><dd id="railHeat"></dd></div>
            </dl>
          </section>
          <section class="article-governance">
            <div><i data-lucide="scale"></i><span>引用与纠错</span></div>
            <p>摘要不替代原文，版权归原作者或发布机构所有。</p>
            <a id="correctionLink" href="governance.html#correction">查看规则与提交纠错 <i data-lucide="arrow-up-right"></i></a>
          </section>
        </aside>
      </div>
    </article>

    <section id="relatedSection" class="related-section" hidden>
      <div class="related-head"><span>RELATED SIGNALS</span><h2>相关内容</h2></div>
      <div id="relatedStories" class="related-grid"></div>
    </section>
  </main>

  <div id="articleToast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
