name: Build public indexes

on:
  push:
    paths:
      - "data/content.json"
      - "scripts/generate_sitemap.py"
      - "scripts/generate_feeds.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate sitemap and feeds
        run: |
          python scripts/generate_sitemap.py
          python scripts/generate_feeds.py

      - name: Commit generated indexes
        run: |
          git config user.name "information-share-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sitemap.xml feed.xml feed.json opensearch.xml
          git diff --cached --quiet || git commit -m "chore: rebuild public indexes"
          git push
