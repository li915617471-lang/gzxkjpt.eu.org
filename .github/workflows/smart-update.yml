name: Smart industry update

on:
  push:
    branches: [main]
    paths:
      - "scripts/auto_update.py"
      - "scripts/sync_supabase_drafts.py"
      - "data/update-sources.json"
      - ".github/workflows/smart-update.yml"
  schedule:
    # 北京时间 08:17，避开 GitHub Actions 整点调度高峰。
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  collect-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test collection classifier
        run: python -m unittest discover -s tests -v

      - name: Collect public RSS drafts
        env:
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MODEL: openai/gpt-4.1-mini
          ARTICLE_GENERATION_TARGET_PER_CATEGORY: "3"
          ARTICLE_FORCE_STRUCTURED_FALLBACK: "false"
        run: python scripts/auto_update.py

      - name: Validate updated site data
        run: |
          python scripts/generate_sitemap.py
          python scripts/generate_feeds.py
          python scripts/validate_site.py

      - name: Sync collected drafts to Supabase
        env:
          SUPABASE_URL: https://zpwqkveymyfwgebpkemt.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SITE_ID: main
          AUTO_APPROVAL_ENABLED: "true"
          AUTO_APPROVAL_MIN_CONFIDENCE: "85"
          AUTO_APPROVAL_FALLBACK_CONFIDENCE: "78"
          AUTO_APPROVAL_DAILY_TARGET: "3"
        run: |
          set -o pipefail
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Supabase sync skipped: repository secret SUPABASE_SERVICE_ROLE_KEY is not configured." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python scripts/sync_supabase_drafts.py | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit updated draft queue
        run: |
          git config user.name "information-share-bot"
          git config user.email "actions@users.noreply.github.com"
          # Public indexes are committed by build-indexes.yml. Keeping this
          # workflow to its own draft data prevents concurrent commit conflicts.
          git add data/intelligence-draft.json data/collection-logs.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh intelligence drafts"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              sleep $((attempt * 3))
            done
            exit 1
          fi
