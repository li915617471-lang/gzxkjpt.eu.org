name: Smart industry update

on:
  push:
    branches: [main]
    paths:
      - "scripts/auto_update.py"
      - "scripts/sync_supabase_drafts.py"
      - "data/update-sources.json"
      - ".github/workflows/smart-update.yml"
      - ".github/workflows/smart-update-retry.yml"
  schedule:
    # 每 2 小时第 17 分钟运行一次，提供公益免费的近实时更新。
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: smart-industry-update
  cancel-in-progress: false

jobs:
  collect-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test collection classifier
        run: python -m unittest discover -s tests -v

      - name: Collect articles and official science videos
        id: collect
        env:
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MODEL: openai/gpt-4.1-mini
          ARTICLE_GENERATION_TARGET_PER_CATEGORY: "2"
          ARTICLE_CANDIDATE_TARGET_PER_CATEGORY: "5"
          FOREIGN_ARTICLE_GENERATION_TARGET: "2"
          VIDEO_GENERATION_TARGET: "4"
          FREE_TRANSLATION_TARGET: "6"
          MAX_SOURCE_AGE_DAYS: "45"
          ARTICLE_FORCE_STRUCTURED_FALLBACK: "false"
        run: python scripts/auto_update.py

      - name: Validate updated site data
        id: validate
        run: |
          python scripts/generate_sitemap.py
          python scripts/generate_feeds.py
          python scripts/validate_site.py

      - name: Sync collected drafts to Supabase
        id: sync
        env:
          SUPABASE_URL: https://zpwqkveymyfwgebpkemt.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SITE_ID: main
          AUTO_APPROVAL_ENABLED: "true"
          AUTO_APPROVAL_MIN_CONFIDENCE: "85"
          AUTO_APPROVAL_FALLBACK_CONFIDENCE: "78"
          AUTO_APPROVAL_DAILY_TARGET: "2"
          AUTO_APPROVAL_CHINESE_ARTICLE_TARGET: "10"
          AUTO_APPROVAL_FOREIGN_ARTICLE_TARGET: "2"
          AUTO_APPROVAL_VIDEO_TARGET: "4"
          AUTO_APPROVAL_SOURCE_MIX_ENFORCED: "true"
        run: |
          set -o pipefail
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Supabase sync skipped: repository secret SUPABASE_SERVICE_ROLE_KEY is not configured." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python scripts/sync_supabase_drafts.py | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit updated draft queue
        if: ${{ always() && steps.collect.outcome == 'success' && steps.validate.outcome == 'success' }}
        run: |
          git config user.name "information-share-bot"
          git config user.email "actions@users.noreply.github.com"
          # Validation regenerates public indexes, while build-indexes.yml owns
          # those files. Keep this job clean so a concurrent index commit can
          # be rebased without Git refusing because of unstaged changes.
          git restore --worktree sitemap.xml feed.xml feed.json opensearch.xml
          # Public indexes are committed by build-indexes.yml. Keeping this
          # workflow to its own draft data prevents concurrent commit conflicts.
          git add data/intelligence-draft.json data/collection-logs.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh intelligence drafts"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              sleep $((attempt * 3))
            done
            exit 1
          fi
