name: Retry failed smart update

on:
  workflow_run:
    workflows: ["Smart industry update"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry-once:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch one replacement run
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run smart-update.yml --ref "$DEFAULT_BRANCH"
